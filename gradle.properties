# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies
android.nonTransitiveRClass=true

# AGP 9's built-in Kotlin support and "new DSL" use a different plugin/config
# shape than this project is written against; keep the legacy DSL and standalone
# Kotlin Gradle plugin instead. (Opt-out is available through the AGP 9.x line;
# revisit this before upgrading to AGP 10.)
android.builtInKotlin=false
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# Glance's widget rendering does not survive R8 full mode (the widget silently stays on its
# initialLayout placeholder). Standard R8 shrinking/obfuscation still applies.
android.enableR8.fullMode=false
